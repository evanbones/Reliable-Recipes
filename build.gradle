plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'org.moddedmc.wiki.toolkit' version '0.5.0'
}

wiki {
    wikiAccessToken = System.getenv("WIKI_ACCESS_TOKEN")
    docs.create("reliable-recipes") {
        root = file("docs/")
    }
}